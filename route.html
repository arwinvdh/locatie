<style>
/* Route knijperwagen in dezelfde stijl als Locatie delen: AW-kopband, kaarten met schaduw, pilknoppen, Avenir Next.
   Opbouw: stops als accordeon (één stop open), bericht rechts (sticky). Smal scherm: tabs Stops/Bericht, actiebalk onderaan. */
:root {
  --bg: #EEF3F8; --surface: #FFFFFF; --field: #FFFFFF; --ink: #0E2236; --ink-2: #566879; --line: #D0DAE5;
  --accent: #014983; --on-accent: #FFFFFF; --warn: #B42318; --ok: #3F7D0A; --focus: #014983;
  --a-laden: #014983; --a-lossen: #3F7D0A; --a-ophalen: #9A5B00;
  --scrim: rgba(0, 31, 56, 0.5); --brand-dark: #001f38; --brand-green: #76b720;
  --wa-wall: #EAE3D8; --wa-bubble: #D9FDD3; --wa-text: #111B21; --wa-link: #027EB5;
  --font: 'Avenir Next', 'Avenir Next LT Pro', Avenir, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow: 0 12px 20px 0 rgba(0, 31, 56, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1520; --surface: #112030; --field: #0C1824; --ink: #E6ECF2; --ink-2: #93A5B7; --line: #24384A;
    --accent: #5AA6E6; --on-accent: #001f38; --warn: #FF8A7A; --ok: #8fd000; --focus: #7FB9EE;
    --a-laden: #5AA6E6; --a-lossen: #8fd000; --a-ophalen: #F0B35A;
    --wa-wall: #0B141A; --wa-bubble: #005C4B; --wa-text: #E9EDEF; --wa-link: #53BDEB; --shadow: 0 12px 20px 0 rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1520; --surface: #112030; --field: #0C1824; --ink: #E6ECF2; --ink-2: #93A5B7; --line: #24384A;
  --accent: #5AA6E6; --on-accent: #001f38; --warn: #FF8A7A; --ok: #8fd000; --focus: #7FB9EE;
  --a-laden: #5AA6E6; --a-lossen: #8fd000; --a-ophalen: #F0B35A;
  --wa-wall: #0B141A; --wa-bubble: #005C4B; --wa-text: #E9EDEF; --wa-link: #53BDEB; --shadow: 0 12px 20px 0 rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand-dark); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 0.9375rem; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.in :focus-visible { outline-offset: -2px; }

/* kopband, zoals Locatie delen: in beide thema's donker, met groene rand */
.brand { background: var(--brand-dark); color: #fff; border-bottom: 3px solid var(--brand-green); padding-block: 0.75rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand .in { max-width: 68rem; margin-inline: auto; display: flex; align-items: center; gap: 0.6rem; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand-green); flex: none; }
.brand h1 { margin: 0; font-size: 1.125rem; font-weight: 600; letter-spacing: 0.01em; line-height: 1.2; color: #fff; }
.gear { margin-left: auto; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; }
.gear:hover { background: rgba(255, 255, 255, 0.14); }

.wrap { max-width: 68rem; margin-inline: auto; padding: 1rem max(16px, env(safe-area-inset-right, 0px)) 10rem max(16px, env(safe-area-inset-left, 0px)); }

.tip { display: flex; gap: 0.75rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding: 0.6rem 0.75rem; border: 1px solid var(--brand-green); border-radius: 12px; background: color-mix(in srgb, var(--brand-green) 12%, var(--surface)); font-size: 0.875rem; }

/* tabs op smal scherm: pilschakelaar */
.tabs { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; padding-block: 0.25rem 0.75rem; background: var(--bg); }
.tabs-in { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--field); }
.tabs button { min-height: 44px; border: 0; border-right: 1px solid var(--line); background: transparent; font-weight: 500; cursor: pointer; transition: background-color 0.15s, color 0.15s; }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.tabs .tab-n { color: var(--warn); font-weight: 600; }
.tabs button[aria-selected="true"] .tab-n { color: var(--on-accent); }

.grid { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 48rem) {
  .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
  .preview { position: sticky; top: 1rem; }
}
@media (max-width: 47.999rem) {
  .tabs { display: block; }
  body[data-view="stops"] .preview { display: none; }
  body[data-view="bericht"] #stops-pane { display: none; }
  .stop { scroll-margin-top: calc(4.75rem + env(safe-area-inset-top, 0px)); }
  .toast { bottom: 9.5rem; }
}

/* kaarten */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0.875rem; display: grid; gap: 0.6rem; box-shadow: var(--shadow); }
.card h2 { margin: 0; min-height: 32px; display: flex; align-items: center; font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
.card-hd { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.card-hd .tools-r { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
#stops-pane { display: grid; gap: 1rem; min-width: 0; }

.field { display: grid; gap: 0.15rem; min-width: 0; }
.field > label { font-size: 0.8125rem; color: var(--ink-2); }
.inp { width: 100%; min-height: 44px; padding: 0.4rem 0.75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); font-size: 1rem; transition: border-color 0.15s, box-shadow 0.15s; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); outline: none; }
textarea.inp { resize: none; overflow: hidden; line-height: 1.35; display: block; }

.btn { min-height: 44px; padding: 0.35rem 1.1rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-align: center; text-decoration: none; transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.12s, opacity 0.15s; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.sm { min-height: 36px; padding: 0.2rem 0.75rem; font-size: 0.875rem; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.wide { width: 100%; }
.btn.add { border-style: dashed; }

.paste-body { display: grid; gap: 0.5rem; }
.paste-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.paste-msg { color: var(--ink-2); min-width: 0; }
.paste-msg.bad { color: var(--warn); }
.r-dn { display: grid; gap: 0.5rem; grid-template-columns: auto minmax(0, 1fr); align-items: start; }
.r-dn input[type="date"] { width: auto; min-width: 0; }
.hint { font-size: 0.8125rem; color: var(--ink-2); margin: 0; }

/* stops */
#stops { display: grid; gap: 0.6rem; min-width: 0; }
.stop { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 12px rgba(0, 31, 56, 0.05); }
.stop.open { border-color: var(--accent); box-shadow: 0 8px 20px rgba(0, 31, 56, 0.1); }
.hd { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.6rem; width: 100%; min-height: 56px; padding: 0.4rem 0.7rem 0.4rem 0.55rem; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; }
.hd:active { background: var(--bg); }
.hd-sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hd-sum b { font-weight: 600; }
.sa { font-weight: 600; margin-right: 0.35rem; }
.sa.a-LADEN { color: var(--a-laden); }
.sa.a-LOSSEN { color: var(--a-lossen); }
.sa.a-OPHALEN { color: var(--a-ophalen); }
.muted { color: var(--ink-2); }
.stop.bad:not(.open) .badge { border-color: var(--warn); background: var(--warn); color: var(--surface); }
.hd .chev { color: var(--ink-2); transition: transform 0.2s; }
.stop.open .hd .chev { transform: rotate(180deg); }
.badge { display: grid; place-items: center; min-width: 1.9rem; height: 1.9rem; padding: 0 0.3rem; background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); border-radius: 9px; font-weight: 700; font-size: 0.875rem; font-variant-numeric: tabular-nums; position: relative; touch-action: none; cursor: grab; }
.badge::after { content: ""; position: absolute; inset: -10px; }
.hd { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#stops.dragging { cursor: grabbing; }
#stops.dragging .body-wrap, #stops.dragging .more-wrap { transition: none; }
.stop.lift { position: relative; z-index: 3; border-color: var(--accent); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26); transition: none; }
.stop > .body-wrap, .more-wrap { display: grid; grid-template-rows: 0fr; grid-template-columns: minmax(0, 1fr); }
.stop.open > .body-wrap, .more-wrap.open { grid-template-rows: 1fr; }
.body-wrap > .in, .more-wrap > .in { min-height: 0; overflow: hidden; visibility: hidden; }
.stop.open > .body-wrap > .in, .more-wrap.open > .in { visibility: inherit; }
.body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.5rem; min-width: 0; padding: 0 0.7rem 0.7rem; }

/* acties: pilschakelaar met kleur per actie */
.acts { min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--field); }
.acts button { min-height: 46px; padding: 0 0.25rem; border: 0; border-right: 1px solid var(--line); background: transparent; font-weight: 500; cursor: pointer; transition: background-color 0.15s, color 0.15s; }
.acts button:last-child { border-right: 0; }
.acts button[aria-pressed="true"] { color: var(--on-accent); font-weight: 600; }
.acts button[aria-pressed="true"][data-v="LADEN"] { background: var(--a-laden); }
.acts button[aria-pressed="true"][data-v="LOSSEN"] { background: var(--a-lossen); }
.acts button[aria-pressed="true"][data-v="OPHALEN"] { background: var(--a-ophalen); }

.r2 { display: grid; gap: 0.5rem; grid-template-columns: minmax(0, 1fr) 6rem 4.5rem; }
.r4 { display: flex; align-items: center; gap: 0.4rem; }
.more-btn { flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 0.35rem; padding: 0 0.25rem; border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 0.875rem; text-align: left; cursor: pointer; }
.more-btn svg { flex: none; transition: transform 0.15s; }
.more-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.more-btn .sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-weight: 400; }
.tools { display: flex; gap: 0.25rem; }
.ico { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
.ico:hover:not(:disabled) { border-color: var(--ink-2); }
.ico:active:not(:disabled) { transform: scale(0.94); }
.ico:disabled { opacity: 0.35; cursor: default; }
.ico.del:hover { border-color: var(--warn); color: var(--warn); }
.more { display: grid; gap: 0.5rem; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-bottom: 0.1rem; animation: rise 0.25s ease both; }
.more .full { grid-column: 1 / -1; }

/* suggesties: pillen */
.sugg { display: flex; gap: 0.3rem; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.sugg::-webkit-scrollbar { display: none; }
.sugg:not([hidden]) { margin-top: 0.1rem; }
.chip { flex: none; min-height: 40px; max-width: 80vw; padding: 0 0.85rem; border: 1px solid var(--line); border-radius: 999px; background: var(--field); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; transition: border-color 0.15s; }
.chip:hover { border-color: var(--accent); }
.empty { margin: 0; padding: 1.25rem 0; text-align: center; color: var(--ink-2); }

/* bericht */
.wa { padding: 0.75rem; background: var(--wa-wall); border-radius: 12px; }
.bubble { margin-left: auto; width: fit-content; max-width: 100%; padding: 0.5rem 0.7rem; background: var(--wa-bubble); color: var(--wa-text); border-radius: 8px 2px 8px 8px; font-family: var(--font); font-size: 0.9375rem; line-height: 1.38; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.wa-link { color: var(--wa-link); }
.checks .w-h { margin: 0; font-size: 0.9375rem; font-weight: 600; }
.w-bad { color: var(--warn); }
.w-ok { color: var(--ok); }
.checks ul { margin: 0.2rem 0 0; padding-left: 1.1rem; }

/* actiebalk */
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 0.6rem max(16px, env(safe-area-inset-right, 0px)) calc(0.6rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); z-index: 500; }
.bar-stack { max-width: 68rem; margin-inline: auto; display: grid; gap: 0.4rem; }
.undo { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; color: var(--ink-2); }
.undo button { min-height: 36px; padding: 0 0.9rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
.meta { display: flex; flex-wrap: wrap; gap: 0.15rem 0.75rem; align-items: baseline; padding: 0; border: 0; background: transparent; font: inherit; font-size: 0.8125rem; line-height: 1.25; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: left; cursor: pointer; }
.meta .m1 { color: var(--ink); font-weight: 600; }
.meta .bad { color: var(--warn); font-weight: 600; }
.bar-in { display: grid; grid-template-columns: 2fr 1fr; gap: 0.4rem; }
.copy { min-height: 46px; padding: 0 1.1rem; border: 1px solid var(--accent); border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; white-space: nowrap; transition: filter 0.15s, transform 0.12s, background-color 0.15s; }
.copy:hover { filter: brightness(1.08); }
.copy:active { transform: scale(0.97); }
.copy.ghost { background: var(--surface); color: var(--accent); }
.copy.done { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }

/* eerdere routes en instellingen */
.sheet { position: fixed; inset: 0; z-index: 800; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet[hidden] { display: none; }
.sheet-panel { width: 100%; max-width: 40rem; max-height: 85%; overflow-y: auto; padding: 1rem max(16px, env(safe-area-inset-right, 0px)) calc(1rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); border: 1px solid var(--line); border-radius: 16px 16px 0 0; animation: rise 0.2s ease both; }
@media (min-width: 48rem) { .sheet { align-items: center; } .sheet-panel { max-height: 80%; border-radius: 16px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.25rem; }
.sheet-head h2 { margin: 0; font-size: 1.0625rem; font-weight: 600; }
.sync-note { margin: 0 0 0.75rem; color: var(--ink-2); font-size: 0.8125rem; }
.sync-note.bad { color: var(--warn); }
#hist-list { display: grid; gap: 0.5rem; }
.h-item { display: grid; gap: 0.5rem; padding: 0.7rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.h-main { min-width: 0; }
.h-main b { font-weight: 600; }
.h-sub { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-acts { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.h-acts .btn { min-height: 38px; font-size: 0.875rem; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem; width: min(26rem, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 12px 40px rgba(0, 31, 56, 0.3); }
dialog[open] { display: grid; gap: 0.7rem; animation: rise 0.2s ease both; }
dialog::backdrop { background: var(--scrim); }
dialog h2 { margin: 0; font-size: 1.0625rem; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); }
.backup { display: grid; gap: 0.7rem; }
.set-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: 5.5rem; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); padding: 0.5rem 0.9rem; border-radius: 10px; z-index: 900; font-size: 0.875rem; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); animation: rise 0.2s ease both; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.toast { animation-name: riseX; }
@keyframes riseX { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translateX(-50%); } }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise 0.35s ease both; }
  .stop { transition: border-color 0.2s, box-shadow 0.2s; }
  .stop > .body-wrap, .more-wrap { transition: grid-template-rows 0.22s ease; }
  .body-wrap > .in, .more-wrap > .in { transition: visibility 0s linear 0.22s; }
  .stop.open > .body-wrap > .in, .more-wrap.open > .in { transition-delay: 0s; }

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<header class="brand"><div class="in"><span class="dot"></span><h1>Route knijperwagen</h1><button class="gear" id="gear" type="button" aria-label="Instellingen" title="Instellingen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div></header>

<div class="wrap">
  <div class="tip" id="tip" hidden><span>Tip: tik op Deel en kies <b>Zet op beginscherm</b>. Alleen via dat icoon blijven je routes en suggesties betrouwbaar bewaard.</span><button class="btn sm" id="tipX" type="button">Ok</button></div>

  <nav class="tabs" aria-label="Weergave">
    <div class="tabs-in" role="tablist">
      <button id="tab-stops" type="button" role="tab" aria-selected="true" aria-controls="stops-pane" data-view="stops">Stops</button>
      <button id="tab-bericht" type="button" role="tab" aria-selected="false" aria-controls="preview-pane" data-view="bericht">Bericht<span id="tab-n" class="tab-n"></span></button>
    </div>
  </nav>

  <div class="grid">
    <section id="stops-pane" aria-label="Stops">
      <div class="card">
        <div class="card-hd">
          <h2>1 &middot; Route</h2>
          <div class="tools-r">
            <button id="hist-open" class="btn sm" type="button" aria-haspopup="dialog" aria-label="Eerdere routes">Eerder</button>
            <button id="paste-toggle" class="btn sm" type="button" aria-expanded="false" aria-controls="paste-body" aria-label="Route plakken" hidden>Plakken</button>
            <button id="reset" class="btn sm" type="button" aria-label="Nieuwe route">Nieuw</button>
          </div>
        </div>
        <div id="paste-body" class="paste-body" hidden>
          <label class="sr" for="paste-text">Ruwe route</label>
          <textarea id="paste-text" class="inp" rows="5" placeholder="Plak hier je ruwe route, bijvoorbeeld: 1. Laden bij R3S 6.00 -> 1 bigbag spramex"></textarea>
          <div class="paste-actions">
            <button id="paste-go" class="btn primary" type="button">Verwerk</button>
            <button id="paste-stop" class="btn" type="button" hidden>Stop</button>
            <span id="paste-msg" class="paste-msg" role="status"></span>
          </div>
        </div>
        <div class="r-dn">
          <div class="field"><label for="datum">Datum</label><input id="datum" class="inp" type="date"></div>
          <div class="field"><label for="note">Opmerking</label><textarea id="note" class="inp note" rows="1" placeholder="Bovenaan het bericht"></textarea></div>
        </div>
      </div>

      <div class="card">
        <h2>2 &middot; Stops</h2>
        <div id="stops"></div>
        <button id="add" class="btn wide add" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Stop toevoegen
        </button>
      </div>
    </section>

    <aside id="preview-pane" class="preview" aria-label="Voorbeeld">
      <div class="card">
        <h2>3 &middot; Bericht</h2>
        <div class="wa"><div id="bubble" class="bubble"></div></div>
        <div id="checks" class="checks"></div>
      </div>
    </aside>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Eerdere routes</h2>
      <button id="sheet-close" class="btn sm" type="button">Sluiten</button>
    </div>
    <p id="sync-note" class="sync-note"></p>
    <div id="hist-list"></div>
  </div>
</div>

<dialog id="settings">
  <h2>Instellingen</h2>
  <p id="sync-note2" class="hint"></p>
  <div id="backup" class="backup">
    <div class="set-row">
      <button id="exp" class="btn sm" type="button">Back-up maken</button>
      <button id="imp" class="btn sm" type="button">Back-up terugzetten</button>
      <input id="impf" type="file" accept="application/json" hidden>
    </div>
    <p class="hint">Een back-up bevat je eerdere routes en de suggesties voor plaatsen en items.</p>
  </div>
  <p id="ver" class="hint"></p>
  <button id="settingsOk" class="btn primary" type="button">Klaar</button>
</dialog>

<div class="bar">
  <div class="bar-stack">
    <div id="undo" class="undo" hidden role="status">
      <span id="undo-label"></span>
      <button id="undo-btn" type="button">Ongedaan maken</button>
    </div>
    <button id="meta" class="meta" type="button" aria-label="Bericht en opmerkingen bekijken"></button>
    <div class="bar-in">
      <button id="copy" class="copy" type="button">Kopieer</button>
      <a id="wa-send" class="copy ghost" href="https://wa.me/" target="_blank" rel="noopener" aria-label="Stuur via WhatsApp"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>WhatsApp</a>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="status" class="sr" role="status" aria-live="polite"></div>

<script>

/*LOGIC*/
const DAGEN = ['zo','ma','di','wo','do','vr','za'];
const MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const ACT_UI = ['LADEN', 'LOSSEN', 'OPHALEN'];
const ACT_OUT = ['LOSSEN', 'LADEN', 'OPHALEN'];
const VOORZ = ['bij', 'in', 'aan', 'aan de', 'op', ''];
const TIJDV = ['om', 'voor', 'na'];
const DEFAULT_VOORZ = { LADEN: 'bij', LOSSEN: 'in', OPHALEN: 'bij' };
const WAT = { LOSSEN: 'wat er gelost wordt', LADEN: 'wat er geladen wordt', OPHALEN: 'wat er opgehaald wordt' };

function clean(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
function keycaps(n) { return String(n).split('').map(function (d) { return d + '️⃣'; }).join(''); }
function datumLabel(iso) {
  const p = String(iso || '').split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return '';
  const dt = new Date(p[0], p[1] - 1, p[2]);
  return DAGEN[dt.getDay()] + ' ' + p[2] + ' ' + MAANDEN[p[1] - 1];
}
function hasContent(s) { return Boolean(clean(s.plaats) || clean(s.items) || clean(s.project) || clean(s.link)); }
function defaultVoorz(acties) { return acties.length === 1 ? DEFAULT_VOORZ[acties[0]] : ''; }
function nextActies(prev) {
  if (!prev) return ['LADEN'];
  const a = prev.acties || [];
  return (a.indexOf('LADEN') > -1 || a.indexOf('OPHALEN') > -1) ? ['LOSSEN'] : ['LADEN'];
}
function normTijd(t) {
  let v = clean(t).replace(/\s*(uur|u)$/i, '').replace(':', '.');
  if (/^\d{1,2}$/.test(v)) v += '.00';
  else if (/^\d{3,4}$/.test(v)) v = v.slice(0, -2) + '.' + v.slice(-2);
  return v;
}
function itemLines(text) {
  return String(text || '').split(/\r?\n/)
    .map(function (l) { return l.replace(/^\s*[•\-–*]\s*/, '').trim(); })
    .filter(Boolean);
}
function itemParts(text) {
  const out = [];
  itemLines(text).forEach(function (l) {
    l.replace(/([.!?])\s+(?=[A-ZÀ-Ý0-9])/g, '$1\n').split('\n').forEach(function (p) {
      p = p.trim().replace(/\.$/, '');
      if (p) out.push(p);
    });
  });
  return out;
}
function toStop(r) {
  r = (r && typeof r === 'object') ? r : {};
  let raw = [];
  if (Array.isArray(r.acties)) raw = r.acties;
  else if (r.actie === 'GEMENGD') raw = ['LOSSEN', 'LADEN'];
  else if (r.actie) raw = [r.actie];
  const up = raw.map(function (x) { return String(x).toUpperCase(); });
  const acties = ACT_UI.filter(function (a) { return up.indexOf(a) > -1; });
  const voorz = (typeof r.voorz === 'string' && VOORZ.indexOf(r.voorz) > -1) ? r.voorz : defaultVoorz(acties);
  const items = Array.isArray(r.items) ? r.items.map(String).join('\n') : String(r.items == null ? '' : r.items);
  return {
    acties: acties,
    voorz: voorz,
    plaats: String(r.plaats || ''),
    project: String(r.project || '').toUpperCase(),
    tijdv: TIJDV.indexOf(r.tijdv) > -1 ? r.tijdv : 'om',
    tijd: String(r.tijd || ''),
    items: items,
    link: String(r.link || ''),
    more: typeof r.more === 'boolean' ? r.more : undefined
  };
}

function stopText(s, n) {
  const plaats = clean(s.plaats);
  const project = clean(s.project).toUpperCase();
  const tijd = normTijd(s.tijd);
  const proj = project ? ' (' + project + ')' : '';
  const t = tijd ? ' ' + (TIJDV.indexOf(s.tijdv) > -1 ? s.tijdv : 'om') + ' ' + tijd + ' uur' : '';
  const acts = ACT_OUT.filter(function (a) { return (s.acties || []).indexOf(a) > -1; });
  let head;
  if (!acts.length) {
    head = '*' + plaats + '*' + proj + t;
  } else {
    const v = clean(s.voorz);
    head = '*' + acts.join(' + ') + '* ' + (v ? v + ' ' : '') + plaats + proj + t;
  }
  const lines = [keycaps(n) + ' ' + head];
  const items = itemParts(s.items);
  if (items.length === 1) lines.push(items[0]);
  else items.forEach(function (l) { lines.push('• ' + l); });
  const link = clean(s.link);
  if (link) lines.push(link);
  return lines.join('\n');
}

function buildMessage(stops, iso, note) {
  const d = datumLabel(iso);
  const title = '*Route' + (d ? ' ' + d : '') + '*';
  const opm = String(note || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean).join('\n');
  const head = opm ? title + '\n\n' + opm : title;
  const blocks = stops.filter(hasContent).map(function (s, i) { return stopText(s, i + 1); });
  return blocks.length ? head + '\n\n' + blocks.join('\n\n') : head;
}

function check(stops) {
  const out = [];
  stops.forEach(function (s, i) {
    if (!hasContent(s)) return;
    const p = 'Stop ' + (i + 1);
    if (!clean(s.plaats)) out.push(p + ': plaats ontbreekt');
    if (!s.acties.length) out.push(p + ': geen actie gekozen');
    const link = clean(s.link);
    if (link && !/^https?:\/\//i.test(link)) out.push(p + ': routelink begint niet met https://');
    const tijd = normTijd(s.tijd);
    if (tijd && !/^\d{1,2}\.\d{2}$/.test(tijd)) out.push(p + ': tijd "' + clean(s.tijd) + '" niet herkend, gebruik bijvoorbeeld 6.30');
    if (!clean(s.items)) out.push(p + (s.acties.length === 1 ? ': niet vermeld ' + WAT[s.acties[0]] : ': omschrijving ontbreekt'));
  });
  const empties = stops.filter(function (s) { return !hasContent(s); }).length;
  if (empties) out.push(empties + (empties > 1 ? ' lege stops worden' : ' lege stop wordt') + ' overgeslagen');
  return out;
}
/*END LOGIC*/

(function () {
  const KEY1 = 'knijperwagen-route-v1';   /* oude opslag: alleen stops */
  const KEY = 'knijperwagen-route-v2';    /* concept: datum, opmerking, stops */
  const HKEY = 'knijperwagen-items-v1';   /* oude itemgeschiedenis */
  const MKEY = 'knijperwagen-mem-v2';     /* geheugen: plaatsen en items */
  const RKEY = 'knijperwagen-routes-v2';  /* eerdere routes per datum */
  const ACT_LABEL = { LADEN: 'Laden', LOSSEN: 'Lossen', OPHALEN: 'Ophalen' };
  const QUICK_TIJD = ['6.00', '6.30', '7.00', '7.30', '8.00'];
  const SUGG_FIELDS = 'textarea[data-f="items"], input[data-f="plaats"], input[data-f="project"], input[data-f="tijd"]';
  const COPY_LABEL = 'Kopieer';
  const $ = function (id) { return document.getElementById(id); };
  const list = $('stops'), bubble = $('bubble'), checks = $('checks'), meta = $('meta'),
        datum = $('datum'), noteEl = $('note'), copyBtn = $('copy'), waBtn = $('wa-send'),
        status = $('status'), undo = $('undo'), resetBtn = $('reset'),
        pasteToggle = $('paste-toggle'), pasteBody = $('paste-body'),
        pasteText = $('paste-text'), pasteGo = $('paste-go'), pasteStop = $('paste-stop'),
        pasteMsg = $('paste-msg'), sheet = $('sheet'), histList = $('hist-list'),
        syncNote = $('sync-note'), histOpen = $('hist-open'), tabN = $('tab-n');
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const VERSION = '2026.10.22-a';

  /* meldingen en vangnet: een fout wordt zichtbaar in plaats van stil te falen */
  let toastT = null, lastErr = '';
  function toast(t) {
    const el = $('toast');
    el.textContent = t; el.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.hidden = true; }, 2600);
  }
  function showErr(m) {
    m = String(m || '').slice(0, 140);
    if (!m || m === lastErr || /^Script error/i.test(m) || /ResizeObserver/i.test(m)) return;
    lastErr = m;
    toast('Fout: ' + m);
    setTimeout(function () { lastErr = ''; }, 8000);
  }
  window.addEventListener('error', function (e) { showErr(e.message + (e.lineno ? ' (regel ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { showErr(e.reason && e.reason.message || e.reason); });

  let stops = [];
  let note = '';
  let nextId = 1;
  let activeId = null;
  let undoFn = null, undoTimer = null, resetTimer = null, copyTimer = null, suggTimer = null, routeTimer = null;
  let sample = null, pasteCtl = null;
  let db = null, dbFail = false, dbQueue = Promise.resolve();
  let mem = { places: {}, items: [] };
  let routes = {};

  const ICON = {
    up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
    down: '<path d="M12 5v14M5 12l7 7 7-7"/>',
    del: '<path d="M6 6l12 12M18 6L6 18"/>',
    dup: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
    chev: '<path d="M6 9l6 6 6-6"/>'
  };
  function icon(name, size, cls) {
    return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" width="' + (size || 18) + '" height="' + (size || 18) + '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function blank() {
    const prev = stops.length ? stops[stops.length - 1] : null;
    const acties = nextActies(prev);
    return { id: nextId++, acties: acties, voorz: defaultVoorz(acties), plaats: '', project: '', tijdv: 'om', tijd: '', items: '', link: '', more: undefined };
  }
  function todayIso() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function adopt(arr) {
    stops = arr.map(function (r, i) { const s = toStop(r); s.id = i + 1; return s; });
    nextId = stops.length + 1;
    activeId = null;
  }
  function snapshot() { return { stops: stops.map(toStop), note: note, datum: datum.value }; }
  function restore(p) {
    adopt(p.stops); note = p.note; datum.value = p.datum; noteEl.value = note;
    renderStops(); update(); autosize(noteEl);
  }

  /* opslag: concept en geheugen lokaal, eerdere routes en geheugen ook gedeeld via db */
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* opslag mag ontbreken */ } }
  function loadDraft() {
    const o = lsGet(KEY);
    if (o && Array.isArray(o.stops)) return o;
    const old = lsGet(KEY1);
    return Array.isArray(old) ? { stops: old } : null;
  }
  function save() { lsSet(KEY, { datum: datum.value, note: note, stops: stops }); }
  function slim(arr) {
    return arr.map(function (s) {
      return { acties: s.acties, voorz: s.voorz, plaats: s.plaats, project: s.project, tijdv: s.tijdv, tijd: s.tijd, items: s.items, link: s.link };
    });
  }
  function loadMem() {
    const m = lsGet(MKEY);
    if (m && m.places && Array.isArray(m.items)) { mem = { places: m.places, items: m.items }; return; }
    const old = lsGet(HKEY);
    if (Array.isArray(old)) {
      mem.items = old.filter(function (x) { return typeof x === 'string'; }).slice(0, 80)
        .map(function (t, i) { return { t: t, p: '', ts: 1000 - i }; });
    }
  }
  function dbWrite(fn) {
    if (!db) return;
    dbQueue = dbQueue.then(fn).then(function () { dbFail = false; }, function () { dbFail = true; }).then(syncText);
  }
  function saveMem() {
    lsSet(MKEY, mem);
    dbWrite(function () { return db.doc('memory/main').set({ places: mem.places, items: mem.items, t: Date.now() }); });
  }
  function trimMem() {
    const keys = Object.keys(mem.places).sort(function (a, b) { return (mem.places[b].t || 0) - (mem.places[a].t || 0); });
    keys.slice(200).forEach(function (k) { delete mem.places[k]; });
    mem.items.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    mem.items = mem.items.slice(0, 300);
  }
  function learn() {
    const now = Date.now();
    stops.filter(hasContent).forEach(function (s) {
      const pl = clean(s.plaats);
      if (!pl) return;
      const k = pl.toLowerCase(), o = mem.places[k] || {};
      mem.places[k] = { p: pl, pr: clean(s.project).toUpperCase() || o.pr || '', l: clean(s.link) || o.l || '', n: (o.n || 0) + 1, t: now };
      itemLines(s.items).forEach(function (l) {
        const lk = l.toLowerCase();
        const hit = mem.items.find(function (x) { return x.t.toLowerCase() === lk; });
        if (hit) { hit.ts = now; hit.p = k; } else mem.items.push({ t: l, p: k, ts: now });
      });
    });
    trimMem();
    saveMem();
  }
  function routeEntry() {
    return { datum: datum.value, note: note, stops: slim(stops), t: Date.now() };
  }
  function saveRouteNow() {
    clearTimeout(routeTimer); routeTimer = null;
    if (!datum.value || !stops.some(hasContent)) return;
    const e = routeEntry();
    routes[e.datum] = e;
    pruneRoutes();
    lsSet(RKEY, routes);
    dbWrite(function () { return db.doc('routes/' + e.datum).set(e); });
  }
  function scheduleRouteSave() {
    clearTimeout(routeTimer);
    routeTimer = setTimeout(saveRouteNow, 2500);
  }
  function flushRoute() { if (routeTimer) saveRouteNow(); }
  function pruneRoutes() {
    Object.keys(routes).sort().reverse().slice(40).forEach(function (d) { delete routes[d]; });
  }
  function mergeRemote(m, rs) {
    const pushRoutes = [];
    if (m && m.places) {
      Object.keys(m.places).forEach(function (k) {
        const r = m.places[k], l = mem.places[k];
        if (!l || (r.t || 0) > (l.t || 0)) mem.places[k] = r;
      });
      (m.items || []).forEach(function (r) {
        if (!r || typeof r.t !== 'string') return;
        const hit = mem.items.find(function (x) { return x.t.toLowerCase() === r.t.toLowerCase(); });
        if (!hit) mem.items.push(r);
        else if ((r.ts || 0) > (hit.ts || 0)) { hit.ts = r.ts; hit.p = r.p; }
      });
      trimMem();
    }
    const remoteT = {};
    rs.forEach(function (r) {
      if (!r || !r.datum || !Array.isArray(r.stops)) return;
      remoteT[r.datum] = r.t || 0;
      if (!routes[r.datum] || (r.t || 0) > (routes[r.datum].t || 0)) routes[r.datum] = r;
    });
    pruneRoutes();
    Object.keys(routes).forEach(function (d) {
      if (!(d in remoteT) || routes[d].t > remoteT[d]) pushRoutes.push(routes[d]);
    });
    return pushRoutes;
  }
  function initDb(d) {
    db = d;
    syncText();
    Promise.all([
      db.doc('memory/main').get(),
      db.collection('routes').orderBy('t', 'desc').limit(40).get()
    ]).then(function (res) {
      const m = res[0].exists ? res[0].data() : null;
      const rs = res[1].docs.map(function (x) { return x.data(); });
      const push = mergeRemote(m, rs);
      lsSet(MKEY, mem); lsSet(RKEY, routes);
      if (Object.keys(mem.places).length || mem.items.length) saveMem();
      push.forEach(function (e) { dbWrite(function () { return db.doc('routes/' + e.datum).set(e); }); });
    }).catch(function () { dbFail = true; }).then(function () {
      syncText();
      if (!sheet.hidden) renderHistory();
    });
  }
  function syncText() {
    syncNote.classList.toggle('bad', Boolean(db && dbFail));
    const t = !db ? 'Routes en suggesties worden alleen op dit apparaat bewaard.'
      : dbFail ? 'Delen met je andere apparaten is mislukt. De laatste wijzigingen staan alleen op dit apparaat.'
      : 'Routes en suggesties worden gedeeld tussen je apparaten.';
    syncNote.textContent = t;
    const n2 = document.getElementById('sync-note2'); if (n2) n2.textContent = t;
  }

  /* kaarten: één stop open, de rest een regel met samenvatting */
  function moreOpen(s) { return s.more === true; }
  function summary(s) {
    const bits = [];
    if (clean(s.link)) bits.push('link');
    if (s.voorz !== defaultVoorz(s.acties)) bits.push(s.voorz || 'geen voorzetsel');
    if (s.tijdv !== 'om') bits.push(s.tijdv);
    return bits.join(' · ');
  }
  function sumHtml(s) {
    const acts = ACT_UI.filter(function (a) { return s.acties.indexOf(a) > -1; })
      .map(function (a) { return '<span class="sa a-' + a + '">' + ACT_LABEL[a] + '</span>'; }).join('');
    const plaats = clean(s.plaats), t = normTijd(s.tijd), it = itemLines(s.items)[0] || '';
    if (!acts && !plaats && !it) return '<span class="muted">Nieuwe stop</span>';
    const rest = [t, it].filter(Boolean).join(' · ');
    return acts + '<b>' + esc(plaats || '…') + '</b>' + (rest ? '<span class="muted"> ' + esc(rest) + '</span>' : '');
  }
  function refreshHead(card, s) {
    if (!card) return;
    const h = card.querySelector('.hd-sum');
    if (h) h.innerHTML = sumHtml(s);

  function autosize(el) {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }
  function renderStops() {
    list.innerHTML = stops.length ? stops.map(cardHtml).join('') : '<p class="empty">Nog geen stops.</p>';
    list.querySelectorAll('textarea').forEach(autosize);

  function setActive(id, focusSel) {

    setTimeout(function () { card.scrollIntoView({ block: 'start', behavior: calm ? 'auto' : 'smooth' }); }, calm ? 0 : 240);

  function firstEmpty(card) {
    if (!clean(card.querySelector('[data-f="plaats"]').value)) return '[data-f="plaats"]';

  function addStop() {

  function waHtml(t) {

  /* suggesties: plaatsen, projecten, uren en items */
  function lookupPlace(name, skip) {
    const k = clean(name).toLowerCase();
    if (!k) return null;
    const m = mem.places[k];
    let pr = m ? m.pr : '', l = m ? m.l : '';
    if (!pr || !l) {
      stops.forEach(function (o) {
        if (o === skip || clean(o.plaats).toLowerCase() !== k) return;
        if (!pr) pr = clean(o.project).toUpperCase();
        if (!l) l = clean(o.link);
      });
    }
    return (m || pr || l) ? { pr: pr || '', l: l || '' } : null;
  }
  function placeSuggestions(s, cur) {
    const q = cur.trim().toLowerCase();
    const pool = {};
    Object.keys(mem.places).forEach(function (k) { pool[k] = mem.places[k]; });
    stops.forEach(function (o) {
      const p = clean(o.plaats);
      if (o === s || !p) return;
      const k = p.toLowerCase();
      if (!pool[k]) pool[k] = { p: p, pr: clean(o.project).toUpperCase(), l: clean(o.link), t: 0 };
    });
    return Object.keys(pool)
      .filter(function (k) { return !q || (k.indexOf(q) > -1 && k !== q); })
      .sort(function (a, b) {
        const as = q && a.indexOf(q) === 0 ? 0 : 1, bs = q && b.indexOf(q) === 0 ? 0 : 1;
        return (as - bs) || ((pool[b].t || 0) - (pool[a].t || 0));
      })
      .slice(0, 5)
      .map(function (k) { return pool[k]; });
  }
  function projectSuggestions(s, cur) {
    const q = cur.trim().toUpperCase();
    const out = [];
    function add(p) { p = clean(p).toUpperCase(); if (p && out.indexOf(p) === -1) out.push(p); }
    const here = mem.places[clean(s.plaats).toLowerCase()];
    if (here) add(here.pr);
    stops.forEach(function (o) { if (o !== s) add(o.project); });
    Object.keys(mem.places).sort(function (a, b) { return (mem.places[b].t || 0) - (mem.places[a].t || 0); })
      .forEach(function (k) { add(mem.places[k].pr); });
    return out.filter(function (p) { return !q || (p.indexOf(q) > -1 && p !== q); }).slice(0, 4);
  }
  function tijdSuggestions(cur) {
    const q = cur.trim().replace(':', '.');
    return QUICK_TIJD.filter(function (t) { return !q || (t.indexOf(q) === 0 && t !== q); });
  }
  function itemSuggestions(s, current) {
    const q = current.trim().toLowerCase();
    const pk = clean(s.plaats).toLowerCase();
    const pool = [];
    if (s.acties.indexOf('LOSSEN') > -1) {
      for (let j = stops.indexOf(s) - 1; j >= 0; j--) {
        if (stops[j].acties.indexOf('LADEN') > -1 || stops[j].acties.indexOf('OPHALEN') > -1) {
          itemParts(stops[j].items).forEach(function (l) { pool.push(l); });
          break;
        }
      }
    }
    stops.forEach(function (o) { if (o !== s) itemParts(o.items).forEach(function (l) { pool.push(l); }); });
    mem.items.slice().sort(function (a, b) {
      const as = pk && a.p === pk ? 0 : 1, bs = pk && b.p === pk ? 0 : 1;
      return (as - bs) || ((b.ts || 0) - (a.ts || 0));
    }).forEach(function (x) { pool.push(x.t); });
    const own = {};
    itemLines(s.items).forEach(function (l) { own[l.toLowerCase()] = true; });
    const seen = {}, out = [];
    for (let i = 0; i < pool.length && out.length < 5; i++) {
      const k = pool[i].toLowerCase();
      if (seen[k] || own[k]) continue;
      seen[k] = true;
      if (q && (k.indexOf(q) === -1 || k === q)) continue;
      out.push(pool[i]);
    }
    return out;
  }
  function suggBox(el) {
    const card = el.closest('.stop');
    return card && card.querySelector('.sugg[data-for="' + (el.dataset.f === 'items' ? 'items' : 'r2') + '"]');
  }
  function showSugg(el) {
    const s = findStop(el), box = suggBox(el), f = el.dataset.f;
    if (!s || !box) return;
    let arr;
    if (f === 'items') {
      const lines = el.value.split('\n');
      arr = itemSuggestions(s, lines[lines.length - 1]).map(function (t) { return { t: t, label: t }; });
    } else if (f === 'plaats') {
      arr = placeSuggestions(s, el.value).map(function (p) { return { t: p.p, label: p.p + (p.pr ? ' · ' + p.pr : '') }; });
    } else if (f === 'tijd') {
      arr = tijdSuggestions(el.value).map(function (t) { return { t: t, label: t }; });
    } else {
      arr = projectSuggestions(s, el.value).map(function (t) { return { t: t, label: t }; });
    }
    list.querySelectorAll('.sugg').forEach(function (b) { if (b !== box) b.hidden = true; });
    box.innerHTML = arr.map(function (x) {
      return '<button type="button" class="chip" data-sf="' + f + '" data-t="' + esc(x.t) + '">' + esc(x.label) + '</button>';
    }).join('');
    box.hidden = !arr.length;
  }
  function hideAllSugg() { list.querySelectorAll('.sugg').forEach(function (b) { b.hidden = true; }); }

  function setField(card, f, v) {
    const el = card.querySelector('[data-f="' + f + '"]');
    if (el) el.value = v;
  }
  function fillFromPlace(s, card) {
    const info = lookupPlace(s.plaats, s);
    if (!info) return false;
    let changed = false;
    if (!clean(s.project) && info.pr) { s.project = info.pr; setField(card, 'project', info.pr); changed = true; }
    if (!clean(s.link) && info.l) { s.link = info.l; setField(card, 'link', info.l); changed = true; }
    if (changed) refreshHead(card, s);
    return changed;
  }

  list.addEventListener('focusin', function (e) {
    if (e.target.matches(SUGG_FIELDS)) { clearTimeout(suggTimer); showSugg(e.target); }
  });
  list.addEventListener('focusout', function (e) {
    const t = e.target;
    if (t.matches(SUGG_FIELDS)) {
      suggTimer = setTimeout(function () { if (!document.activeElement || !document.activeElement.matches(SUGG_FIELDS)) hideAllSugg(); }, 250);
    }

      const s = findStop(t);

    }

  list.addEventListener('pointerdown', function (e) {

  list.addEventListener('input', function (e) {

  });

  list.addEventListener('click', function (e) {
    const chip = e.target.closest('.chip');
    if (chip) {
      const card = chip.closest('.stop');
      const s = findStop(chip);
      const f = chip.dataset.sf;
      const items = card.querySelector('textarea[data-f="items"]');
      if (f === 'items') {
        const lines = items.value.split('\n');
        lines[lines.length - 1] = chip.dataset.t;
        items.value = lines.join('\n');
        s.items = items.value;
        autosize(items);
        items.focus();

      } else {
        if (f === 'plaats') { s.plaats = chip.dataset.t; setField(card, 'plaats', s.plaats); fillFromPlace(s, card); }
        else if (f === 'tijd') { s.tijd = chip.dataset.t; setField(card, 'tijd', s.tijd); }
        else { s.project = chip.dataset.t; setField(card, 'project', s.project); }
        items.focus();
      }
      refreshHead(card, s);
      update();
      return;
    }
    const b = e.target.closest('button[data-do]');
    if (!b) return;
    const s = findStop(b);
    if (!s) return;
    const card = b.closest('.stop');
    const i = stops.indexOf(s);
    const act = b.dataset.do;
    if (act === 'open') {
      if (activeId === s.id) setActive(null);
      else setActive(s.id, firstEmpty(card));
    } else if (act === 'next') {
      if (i < stops.length - 1) {
        const nx = stops[i + 1];
        setActive(nx.id, firstEmpty(list.querySelector('[data-id="' + nx.id + '"]')));
      } else addStop();
    } else if (act === 'act') {
      const was = defaultVoorz(s.acties);

      setField(card, 'voorz', s.voorz);

  /* slepen: pak het nummer van een stop vast en sleep */
  let drag = null, suppressClick = false;
  list.addEventListener('click', function (e) {
    if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
  list.addEventListener('pointerdown', function (e) {
    const bd = e.target.closest('.badge');
    if (!bd || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const card = bd.closest('.stop');
    drag = { card: card, pid: e.pointerId, y0: e.clientY, sy0: window.scrollY, y: e.clientY, top0: card.getBoundingClientRect().top, started: false, raf: 0 };
    try { bd.setPointerCapture(e.pointerId); } catch (x) { /* zonder capture blijft slepen werken met pointermove op de lijst */ }
  });
  list.addEventListener('pointermove', function (e) {
    const d = drag;
    if (!d || e.pointerId !== d.pid) return;
    d.y = e.clientY;
    if (!d.started && Math.abs(e.clientY - d.y0) > 6) dragStart();
  });
  list.addEventListener('pointerup', function (e) { if (drag && e.pointerId === drag.pid) endDrag(true); });
  list.addEventListener('pointercancel', function (e) { if (drag && e.pointerId === drag.pid) endDrag(false); });
  function dragStart() {
    const d = drag;
    d.started = true;
    list.classList.add('dragging');
    activeId = null;
    list.querySelectorAll('.stop').forEach(function (c) {
      c.classList.remove('open');
      c.querySelector('.hd').setAttribute('aria-expanded', 'false');

    hideAllSugg();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    d.cards = Array.from(list.querySelectorAll('.stop'));

    d.shift = d.top0 - d.card.getBoundingClientRect().top;

  }
  function dragTick() {
    const d = drag;
    if (!d || !d.started) return;
    const top = 130, bottom = window.innerHeight - 150;
    let v = 0;
    if (d.y < top) v = -Math.min(18, Math.ceil((top - d.y) / 6));
    else if (d.y > bottom) v = Math.min(18, Math.ceil((d.y - bottom) / 6));
    if (v) window.scrollBy(0, v);
    const ty = (d.y + window.scrollY) - (d.y0 + d.sy0) + d.shift;
    d.card.style.transform = 'translateY(' + ty + 'px)';
    const mid = d.card.offsetTop + d.card.offsetHeight / 2 + ty;
    let to = 0;
    d.cards.forEach(function (c) { if (c !== d.card && c.offsetTop + c.offsetHeight / 2 < mid) to++; });
    d.to = to;
    d.cards.forEach(function (c, i) {
      if (c === d.card) return;

      if (d.to > d.from && i > d.from && i <= d.to) s = -d.h;
      else if (d.to < d.from && i >= d.to && i < d.from) s = d.h;

  }
  function endDrag(commit) {

    if (!d) return;
    cancelAnimationFrame(d.raf);
    if (!d.started) return;
    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 60);
    d.cards.forEach(function (c) { c.style.transform = ''; c.classList.remove('lift'); });
    list.classList.remove('dragging');
    if (commit && d.to !== d.from) {
      stops.splice(d.to, 0, stops.splice(d.from, 1)[0]);
      renderStops(); update();
      status.textContent = 'Stop verplaatst naar positie ' + (d.to + 1);
    }
  }

  function offerUndo(label, fn) {

  $('undo-btn').addEventListener('click', function () {

  });

  $('add').addEventListener('click', addStop);

  resetBtn.addEventListener('click', function () {
    if (resetBtn.dataset.armed === '1') {
      clearTimeout(resetTimer);
      resetBtn.dataset.armed = '';
      resetBtn.textContent = 'Nieuw';
      resetBtn.classList.remove('danger');
      flushRoute();
      nextId = 1; stops = []; stops = [blank()];
      note = ''; noteEl.value = ''; autosize(noteEl);
      datum.value = todayIso();
      undo.hidden = true;
      activeId = stops[0].id;
      renderStops(); update();
      const f = $('s' + stops[0].id + '-plaats');
      if (f) f.focus({ preventScroll: true });
    } else {
      resetBtn.dataset.armed = '1';
      resetBtn.textContent = 'Wissen?';
      resetBtn.classList.add('danger');
      resetTimer = setTimeout(function () {
        resetBtn.dataset.armed = '';
        resetBtn.textContent = 'Nieuw';
        resetBtn.classList.remove('danger');
      }, 4000);
    }
  });

  datum.addEventListener('input', update);
  noteEl.addEventListener('input', function () { note = noteEl.value; autosize(noteEl); update(); });

  /* tabs op smalle schermen */
  const viewPos = { stops: 0, bericht: 0 };
  function setView(v, keep) {
    const was = document.body.dataset.view;
    if (was) viewPos[was] = window.scrollY;
    document.body.dataset.view = v;
    ['stops', 'bericht'].forEach(function (k) { $('tab-' + k).setAttribute('aria-selected', String(k === v)); });
    if (v === 'stops') { list.querySelectorAll('textarea').forEach(autosize); autosize(noteEl); }
    window.scrollTo(0, keep ? viewPos[v] : 0);
  }
  document.querySelector('.tabs').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-view]');
    if (b) setView(b.dataset.view, true);
  });
  meta.addEventListener('click', function () { setView('bericht'); });

  /* eerdere routes */
  function routeCard(r) {
    const n = r.stops.filter(hasContent).length;
    const places = [];
    r.stops.forEach(function (s) { const p = clean(s.plaats); if (p && places.indexOf(p) === -1) places.push(p); });
    return '<article class="h-item" data-d="' + esc(r.datum) + '">' +
      '<div class="h-main"><b>' + esc(datumLabel(r.datum) || r.datum) + '</b> · ' + n + (n === 1 ? ' stop' : ' stops') +
      '<div class="h-sub">' + esc(places.join(', ')) + '</div></div>' +
      '<div class="h-acts">' +
        '<button type="button" class="btn" data-h="open">Openen</button>' +
        '<button type="button" class="btn" data-h="base">Als basis voor vandaag</button>' +
        '<button type="button" class="btn" data-h="del">Wissen</button>' +
      '</div></article>';
  }
  function renderHistory() {
    const keys = Object.keys(routes).sort().reverse();
    histList.innerHTML = keys.length
      ? keys.map(function (d) { return routeCard(routes[d]); }).join('')
      : '<p class="empty">Nog geen routes bewaard. Een route komt hier te staan zodra je hem aanpast of kopieert.</p>';
    syncText();
  }
  function openSheet() { flushRoute(); renderHistory(); sheet.hidden = false; $('sheet-close').focus(); }
  function closeSheet() { sheet.hidden = true; histOpen.focus(); }
  histOpen.addEventListener('click', openSheet);
  $('sheet-close').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  histList.addEventListener('click', function (e) {
    const b = e.target.closest('button[data-h]');
    if (!b) return;
    const d = b.closest('.h-item').dataset.d, r = routes[d];
    if (!r) return;
    if (b.dataset.h === 'del') {
      if (b.dataset.armed !== '1') {
        b.dataset.armed = '1'; b.textContent = 'Zeker?'; b.classList.add('danger');
        setTimeout(function () { if (b.isConnected) { b.dataset.armed = ''; b.textContent = 'Wissen'; b.classList.remove('danger'); } }, 4000);
        return;
      }
      delete routes[d];
      lsSet(RKEY, routes);
      dbWrite(function () { return db.doc('routes/' + d).delete(); });
      renderHistory();
      return;
    }
    const prev = snapshot();
    const base = b.dataset.h === 'base';
    adopt(r.stops);
    note = base ? '' : (r.note || '');
    datum.value = base ? todayIso() : r.datum;
    noteEl.value = note;
    closeSheet();
    renderStops(); update(); autosize(noteEl);
    setView('stops');
    offerUndo(base ? 'Route van ' + datumLabel(r.datum) + ' als basis geladen.' : 'Route van ' + datumLabel(r.datum) + ' geopend.', function () { restore(prev); });
  });

  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushRoute(); });
  window.addEventListener('pagehide', flushRoute);

  /* route plakken (vraagt Claude om de tekst te splitsen) */
  function buildPrompt(raw) {
    return [
      'Je zet de ruwe routelijst van een uitvoerder bij een Nederlandse GWW-aannemer om naar stops voor de chauffeur van een knijperwagen.',
      'Antwoord ALLEEN met een JSON-array, één object per stop, in de volgorde van de tekst:',
      '{"acties":["LADEN"|"LOSSEN"|"OPHALEN"],"voorz":"bij"|"in"|"aan"|"aan de"|"op"|null,"plaats":"","project":"","tijdv":"om"|"voor"|"na","tijd":"","items":[""],"link":""}',
      'Regels:',
      '- Eén stop per stap of regel in de tekst. Verzin geen stops en geen informatie. Wat niet in de tekst staat laat je leeg ("" of []).',
      '- acties: LADEN = laden bij een leverancier, depot of project (ook bijladen). LOSSEN = lossen, afleveren, afladen, afgooien, neerzetten. OPHALEN = spullen halen of ophalen op een locatie. Doet de chauffeur op één plek meerdere dingen (bijvoorbeeld afleveren én bijladen), geef dan meerdere acties.',
      '- plaats: alleen de plek (plaatsnaam, straat, leverancier of project), met hoofdletters bij eigennamen.',
      '- items: wat er geladen, gelost of opgehaald wordt, één korte regel per item, in de woorden uit de tekst. Corrigeer duidelijke typefouten (bijvoorbeeld "tirlplaat" wordt "trilplaat"), verander verder niets aan de inhoud.',
      '- project: projectnummers zoals IB25060 in hoofdletters, anders "".',
      '- tijd: cijfers met een punt, bijvoorbeeld "6.00". tijdv is "om", tenzij er "voor" of "na" staat. Geen tijd: tijd "" en tijdv "om".',
      '- link: een URL uit de tekst, anders "".',
      '- voorz: alleen invullen als de tekst het voorzetsel duidelijk geeft (bijvoorbeeld "aan de Leidsevaart" wordt "aan de"), anders null.',
      '',
      'Tekst:',
      '<<<',
      raw,
      '>>>'
    ].join('\n');
  }
  function setBusy(b) {
    pasteGo.disabled = b;
    pasteStop.hidden = !b;
    pasteText.readOnly = b;
  }
  function pasteMessage(msg, bad) {
    pasteMsg.textContent = msg;
    pasteMsg.classList.toggle('bad', Boolean(bad));
  }
  pasteToggle.addEventListener('click', function () {
    const open = pasteBody.hidden;
    pasteBody.hidden = !open;
    pasteToggle.setAttribute('aria-expanded', String(open));
    if (open) { setView('stops'); pasteText.focus(); }
  });
  pasteStop.addEventListener('click', function () { if (pasteCtl) pasteCtl.abort(); });
  pasteGo.addEventListener('click', async function () {
    const raw = pasteText.value.trim();
    if (!raw) { pasteMessage('Plak eerst je route.', true); return; }
    if (!sample) return;
    pasteCtl = new AbortController();
    setBusy(true);
    pasteMessage('Bezig met verwerken...', false);
    try {
      const data = await sample.json(buildPrompt(raw), { modelTier: 'quick', signal: pasteCtl.signal });
      const arr = Array.isArray(data) ? data : (data && Array.isArray(data.stops) ? data.stops : []);
      const parsed = arr.map(toStop).filter(hasContent);
      if (!parsed.length) { pasteMessage('Geen stops herkend. Pas de tekst aan en probeer opnieuw.', true); return; }
      const prev = snapshot();
      adopt(parsed);
      renderStops(); update();
      pasteText.value = '';
      pasteBody.hidden = true;
      pasteToggle.setAttribute('aria-expanded', 'false');
      pasteMessage('', false);
      status.textContent = parsed.length + ' stops ingevuld';
      offerUndo('Route vervangen door ' + parsed.length + (parsed.length === 1 ? ' stop.' : ' stops.'), function () { restore(prev); });
      list.scrollIntoView({ block: 'start' });
    } catch (e) {
      const code = e && e.code;
      if (code === 'cancelled') pasteMessage('Gestopt.', false);
      else if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') {
        pasteToggle.hidden = true; pasteBody.hidden = true;
      }
      else if (code === 'rate_limited') pasteMessage('Te vaak achter elkaar. Probeer het zo opnieuw.', true);
      else if (code === 'invalid_json') pasteMessage('Antwoord was niet te lezen. Probeer opnieuw.', true);
      else pasteMessage('Verwerken is niet gelukt. Probeer opnieuw.', true);
    } finally {
      pasteCtl = null;
      setBusy(false);
    }
  });

  /* kopiëren */
  function selectBubble() {
    const r = document.createRange();
    r.selectNodeContents(bubble);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  function flash(msg, ok) {
    copyBtn.textContent = msg;
    copyBtn.classList.toggle('done', Boolean(ok));
    status.textContent = msg;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { copyBtn.textContent = COPY_LABEL; copyBtn.classList.remove('done'); }, 2200);
  }
  function remember() { learn(); saveRouteNow(); }
  copyBtn.addEventListener('click', async function () {
    const text = buildMessage(stops, datum.value, note);
    try {
      await navigator.clipboard.writeText(text);
      flash('Gekopieerd', true); remember();
    } catch (e) {
      if (fallbackCopy(text)) { flash('Gekopieerd', true); remember(); }
      else { setView('bericht'); selectBubble(); flash('Handmatig kopiëren'); }
    }
  });
  waBtn.addEventListener('click', remember);

  /* instellingen en back-up */
  const dlg = $('settings');
  $('gear').addEventListener('click', function () { syncText(); if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', ''); });
  $('settingsOk').addEventListener('click', function () { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  $('ver').textContent = 'Versie ' + VERSION;
  if (window.claude && typeof window.claude.use === 'function') $('backup').hidden = true;   /* in de Claude-pagina kan een bestand niet gedownload worden; daar delen de apparaten via de database */
  $('exp').addEventListener('click', function () {
    flushRoute();
    const blob = new Blob([JSON.stringify({ v: 1, t: Date.now(), mem: mem, routes: routes }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'route-knijperwagen-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 15000);
    toast('Back-up opgeslagen');
  });
  $('imp').addEventListener('click', function () { $('impf').click(); });
  $('impf').addEventListener('change', function () {
    const f = this.files[0]; this.value = '';
    if (!f) return;
    f.text().then(function (t) {
      const j = JSON.parse(t);
      if (!j || typeof j !== 'object') throw new Error('ongeldig');
      const m = j.mem && j.mem.places ? {
        places: Object.keys(j.mem.places).reduce(function (o, k) { const p = j.mem.places[k]; if (p && typeof p.p === 'string') o[k] = p; return o; }, {}),
        items: (Array.isArray(j.mem.items) ? j.mem.items : []).filter(function (x) { return x && typeof x.t === 'string'; })
      } : null;
      const rs = Object.keys(j.routes || {}).map(function (k) { return j.routes[k]; })
        .filter(function (r) { return r && /^\d{4}-\d{2}-\d{2}$/.test(String(r.datum)) && Array.isArray(r.stops); });
      const push = mergeRemote(m, rs);
      lsSet(MKEY, mem); lsSet(RKEY, routes);
      if (db) { saveMem(); push.forEach(function (e) { dbWrite(function () { return db.doc('routes/' + e.datum).set(e); }); }); }
      renderHistory();
      toast('Back-up teruggezet');
    }).catch(function () { toast('Ongeldig bestand'); });
  });

  /*PWA*/
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  try { if (ios && !standalone && localStorage.getItem('knijperwagen-tipX') !== '1') $('tip').hidden = false; } catch (e) { /* opslag mag ontbreken */ }
  $('tipX').addEventListener('click', function () { try { localStorage.setItem('knijperwagen-tipX', '1'); } catch (e) { /* idem */ } $('tip').hidden = true; });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () { /* zonder offline-kopie */ });
  /*END PWA*/

  /* start */
  loadMem();
  routes = lsGet(RKEY) || {};
  const d = loadDraft();
  adopt(d && d.stops.length ? d.stops : [{ acties: ['LADEN'], voorz: 'bij' }]);
  if (stops.length === 1 && !hasContent(stops[0])) activeId = stops[0].id;
  note = (d && typeof d.note === 'string') ? d.note : '';
  datum.value = (d && d.datum && d.datum >= todayIso()) ? d.datum : todayIso();
  noteEl.value = note;
  document.body.dataset.view = 'stops';
  syncText();
  renderStops();
  renderPreview();
  autosize(noteEl);

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(function (fn) {
      if (fn) { sample = fn; pasteToggle.hidden = false; }
    }).catch(function () { /* geen plakveld */ });
    window.claude.use('db').then(function (d2) {
      if (d2) initDb(d2);
    }).catch(function () { /* alleen lokaal */ });
  }
})();
</script>
</body>
</html>
